          </mask>
          <clipPath id="ball-clip"><circle r="40"/></clipPath>
          <radialGradient id="ball-shade" cx="-12" cy="-14" r="58" gradientUnits="userSpaceOnUse">

            </g>
          </g>
        </g>

    <form class="corner" method="post" action="/__preview/unlock">
      <label class="open-app" for="pass">Open Grasskickz<span class="open-app-arrow" aria-hidden="true">→</span></label>
      <input type="text" name="username" value="Grasskickz" autocomplete="username" hidden>
      <input type="hidden" name="next" value="/">
      <div class="pass">
        <input class="pass-field" id="pass" name="password" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" spellcheck="false" enterkeyhint="go" maxlength="64" required>
        <button class="pass-go" type="submit" aria-label="Enter"><span aria-hidden="true">→</span></button>
      </div>
      <p class="pass-wrong" id="pass-wrong" hidden>Wrong password</p>
    </form>
